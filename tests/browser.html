<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Floor Memory Browser Integration</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/test-native-icons/css/fontawesome.min.css">
  <link rel="stylesheet" href="/test-native-icons/css/solid.min.css">
  <style>

</head>
<body><main><h1 style="font-size:15px;opacity:.6">SillyTavern extension test host</h1><div id="extensions_settings2"></div><pre id="browser-test-result"></pre></main>
<div id="send_form"><div id="nonQRFormItems"><textarea id="send_textarea" aria-label="聊天输入"></textarea></div></div>
<script type="module">
import { DEFAULT_SETTINGS, MODULE_KEY, isVisible } from '/core.js';
import { VectorCache } from '/embeddings.js';
const tauri = new URLSearchParams(location.search).has('tauri');
const checks = [];
const failures = [];
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const check = async (name, action) => {
    try { await action(); checks.push(name); }
    catch (error) { failures.push(name + ': ' + error.stack); throw error; }
};
async function waitFor(predicate, label, timeout = 7000) {
    const start = Date.now();
    while (Date.now() - start < timeout) { if (await predicate()) return; await delay(30); }
    throw new Error('Timeout: ' + label);
}
const listeners = new Map();
const registeredMacros = new Map();
globalThis.__worldMacros = registeredMacros;
const eventNames = ['CHAT_COMPLETION_PROMPT_READY','GENERATE_AFTER_DATA','GENERATE_AFTER_COMBINE_PROMPTS','WORLDINFO_ENTRIES_LOADED','WORLDINFO_SCAN_DONE','CHAT_CHANGED','CHAT_LOADED','MESSAGE_RECEIVED','MESSAGE_SENT','MESSAGE_UPDATED','MESSAGE_EDITED','MESSAGE_DELETED','MESSAGE_SWIPED','MESSAGE_SWIPE_DELETED','GENERATION_STARTED','GENERATION_ENDED','GENERATION_STOPPED','CHARACTER_MESSAGE_RENDERED'];
const eventSource = { on: (name, callback) => {
    if (!listeners.has(name)) listeners.set(name, []);
    listeners.get(name).push(callback);
} };
const emit = (name, ...args) => (listeners.get(name) ?? []).forEach(callback => callback(...args));
const texts = ['海港船坞完成修船', '星钥藏在古塔密室', '雪山冰洞封印巨兽', '森林旅店结识商人', '沙漠商队借来骆驼', '城堡守卫接受委托', '花园钟楼等待日出', '河谷木桥抵达营地'];
function makeChat() {
    return texts.flatMap((summary, index) => [
        { name:'旅行者', is_user:true, mes:'用户提问' + (index + 1), send_date:100 + index * 2, extra:{} },
        { name:'向导', is_user:false, mes:'<thinking>隐藏推理</thinking><content>回复' + (index + 1) + '</content><summary>' + summary + '</summary>', send_date:101 + index * 2, extra:{ custom:'unchanged' } },
    ]).concat([{ name:'旅行者', is_user:true, mes:'星钥在哪里？', send_date:200, extra:{} }]);
}
let saves = 0;
let ctx = {
    chat: makeChat(), chatId:'browser-chat', characterId:0, characters:[{ avatar:'guide.png' }],
    name1:'旅行者', name2:'向导', chatMetadata:{}, mainApi:'openai', chatCompletionSettings:{ function_calling:true, strip_old_tool_calls:false },
    extensionSettings:{ [MODULE_KEY]:{ ...structuredClone(DEFAULT_SETTINGS), recentCount:2, middleCount:2, recallCount:2, queryFloors:0, keywordDictionary:'星钥', endpoint:location.origin + '/mock/v1', model:'test-embedding' } },
    eventSource, eventTypes:Object.fromEntries(eventNames.map(name => [name,name])),
    saveMetadata:async () => { saves++; },
    saveSettingsDebounced:() => {},
    registerMacro:(name,handler) => registeredMacros.set(name,handler),
};
globalThis.SillyTavern = { getContext:() => ctx };
const workerUrls = [];
const layoutListeners = new Set();
const testLayout = (insets = { top:0, right:0, bottom:0, left:0 }, keyboardOffset = 0) => ({
    safeInsets: insets,
    safeFrame: { left:insets.left, top:insets.top, width:innerWidth - insets.left - insets.right, height:innerHeight - insets.top - insets.bottom },
    ime: { keyboardOffset },
});
if (tauri) {
    globalThis.__TAURI_RUNNING__ = true;
    // Relevant fullscreen contract from TauriTavern v2.3.0 mobile-geometry-firewall.
    // Test host !important overrides as well as the extension's own fallback CSS.
    const geometry = document.createElement('style');
    geometry.textContent = `
        :root { --tt-inset-top:0px; --tt-inset-right:0px; --tt-inset-bottom:0px; --tt-inset-left:0px; --tt-ime-bottom:0px;
            --tt-viewport-bottom-inset:max(var(--tt-inset-bottom), var(--tt-ime-bottom)); }
        @media (max-width:1000px) {
            body [data-tt-mobile-surface="fullscreen-window"][data-tt-mobile-surface][data-tt-mobile-surface] {
                position:fixed !important;
                top:max(var(--tt-inset-top),0px) !important;
                left:max(var(--tt-inset-left),0px) !important;
                right:max(var(--tt-inset-right),0px) !important;
                bottom:max(var(--tt-viewport-bottom-inset),0px) !important;
                width:auto !important; height:auto !important;
                max-width:none !important; max-height:none !important;
                min-width:0 !important; min-height:0 !important; margin:0 !important;
            }
        }`;
    document.head.append(geometry);
    globalThis.addEventListener('resize', () => { for (const callback of layoutListeners) callback(testLayout()); });
    const NativeWorker = globalThis.Worker;
    globalThis.Worker = class extends NativeWorker {
        constructor(url, options) {
            if (options?.type === 'module') throw new Error('Test host blocks module workers');
            workerUrls.push(String(url));
            super(url, options);
        }
    };
    setTimeout(() => {
        globalThis.__TAURITAVERN__ = {
            ready: new Promise(resolve => setTimeout(resolve, 100)),
            api: { layout: { subscribe(callback) { layoutListeners.add(callback); callback(testLayout()); return () => layoutListeners.delete(callback); } } },
        };
    }, 100);
}
const notices = [];
globalThis.toastr = Object.fromEntries(['error','warning','info','success'].map(type => [type, message => notices.push({ type,message })]));
globalThis.__testContext = () => ctx;
function promptFor(chat = ctx.chat) { return chat.filter(isVisible).map((message,index) => ({ ...structuredClone(message), index })); }
async function generate(type = 'normal', prompt = promptFor()) {
    let aborted = false;
    await globalThis.floorMemoryInterceptor(prompt, 32000, () => { aborted = true; }, type);
    assert(!aborted, 'generation unexpectedly aborted: ' + document.querySelector('#fm-status').textContent);
    return prompt;
}
const state = () => fetch('/__state').then(response => response.json());
const enterMemory = () => document.querySelector('#wo-open-floor-memory').click();

try {
    await import(tauri ? '/scripts/extensions/third-party/floor-memory/index.js' : '/scripts/extensions/third-party/world-os/index.js');
    if (tauri) await check('等待 Tauri 宿主 ready 后再挂载扩展设置', async () => {
        await delay(50);
        assert(!document.querySelector('#fm-form'), 'mounted before host ready');
    });
    await waitFor(() => document.querySelector('#fm-form'), 'settings mount');
    await delay(450);
    await check('扩展页只保留启用开关；关闭状态也能从首页打开独立悬浮窗口', async () => {
        const host = document.querySelector('#extensions_settings2');
        const panel = document.querySelector('#world-os');
        const launcher = document.querySelector('#wo-launcher');
        assert(host.querySelectorAll('input,button,select,textarea').length === 1, 'extension page still contains full settings');
        assert(host.querySelector('#wo-enabled')?.type === 'checkbox', 'enable switch missing');
        assert(!host.contains(panel) && panel.parentElement === document.body, 'window still nested in extension drawer');
        assert(!panel.open && launcher.getBoundingClientRect().width > 0, 'initial window/launcher visibility wrong');
        assert(launcher.textContent === 'world os', 'old launcher branding remains');
        launcher.click();
        assert(panel.open && panel.matches(':modal'), 'launcher did not open modal');
        assert(panel.dataset.page === 'home' && !document.querySelector('#wo-home').hidden, 'launcher skipped app home');
        assert(document.querySelector('#floor-memory').hidden && document.querySelector('#wo-back').hidden, 'feature or back visible on home');
        assert(document.querySelector('#wo-open-floor-memory .fa-book') && document.querySelector('.wo-app-label').textContent === '楼层记忆', 'native book icon or app caption missing');
        assert(document.activeElement === document.querySelector('#wo-window-close'), 'opening unexpectedly focused an input');
        assert(launcher.getAttribute('aria-expanded') === 'true', 'launcher state not updated');
        launcher.click();
        assert(document.querySelectorAll('#world-os').length === 1 && document.querySelectorAll('#fm-form').length === 1, 'duplicate window mounted');
    });
    await check('书本图标打开独立功能页；全新启动时所有栏目默认收起', async () => {
        enterMemory();
        const panel = document.querySelector('#world-os');
        assert(panel.dataset.page === 'floor-memory' && !document.querySelector('#floor-memory').hidden, 'feature page not opened');
        assert(document.querySelector('#wo-home').hidden && !document.querySelector('#wo-back').hidden, 'home/back did not switch');
        assert(document.querySelector('#wo-window-title').textContent === '楼层记忆', 'feature title incorrect');
        assert([...panel.querySelectorAll('details')].every(details => !details.open), 'a section still defaults to expanded');
        const back = document.querySelector('#wo-back').getBoundingClientRect();
        const title = document.querySelector('#wo-window-title').getBoundingClientRect();
        assert(back.left < title.left && back.width >= 44 && back.height >= 44, 'back button not reachable at upper left');
    });
    await check('返回功能选择再进入时保留同一表单、草稿和滚动位置，不改旧配置或聊天数据', async () => {
        const form = document.querySelector('#fm-form');
        const before = JSON.stringify([ctx.extensionSettings, ctx.chatMetadata, ctx.chat]);
        const original = form.elements.extractPattern.value;
        form.elements.extractPattern.value = '未保存的总结提取规则';
        document.querySelector('#floor-memory details').open = true;
        const scroll = document.querySelector('.wo-window-body');
        scroll.scrollTop = 150;
        const top = scroll.scrollTop;
        document.querySelector('#wo-back').click();
        assert(document.querySelector('#world-os').open && document.querySelector('#world-os').dataset.page === 'home', 'back closed the window');
        assert(form.getClientRects().length === 0 && document.activeElement === document.querySelector('#wo-open-floor-memory'), 'hidden page still visible or focus not returned');
        enterMemory();
        assert(document.querySelector('#fm-form') === form && form.elements.extractPattern.value === '未保存的总结提取规则', 'navigation rebuilt or reset form');
        assert(scroll.scrollTop === top && document.querySelector('#floor-memory details').open, 'navigation reset view state');
        assert(JSON.stringify([ctx.extensionSettings, ctx.chatMetadata, ctx.chat]) === before, 'page navigation mutated saved data');
        form.elements.extractPattern.value = original;
        scroll.scrollTop = 0;
    });
    await check('扩展启用开关立即保存且同步窗口，不提交其他设置草稿', async () => {
        const panel = document.querySelector('#world-os');
        const form = document.querySelector('#fm-form');
        const saved = structuredClone(ctx.extensionSettings[MODULE_KEY]);
        form.elements.recentCount.value = '777';
        form.elements.extractPattern.value = '[';
        panel.close();
        const toggle = document.querySelector('#fm-enabled');
        toggle.click();
        assert(ctx.extensionSettings[MODULE_KEY].enabled === true && form.elements.enabled.checked, 'outside toggle not saved/synchronized');
        assert(ctx.extensionSettings[MODULE_KEY].recentCount === saved.recentCount && ctx.extensionSettings[MODULE_KEY].extractPattern === saved.extractPattern, 'toggle submitted unrelated invalid draft');
        toggle.click();
        assert(!ctx.extensionSettings[MODULE_KEY].enabled, 'disable switch not immediate');
        document.querySelector('#wo-launcher').click();
        enterMemory();
        assert(form.elements.recentCount.value === '777' && form.elements.extractPattern.value === '[', 'close/open lost settings draft');
        form.elements.enabled.click();
        assert(toggle.checked && ctx.extensionSettings[MODULE_KEY].enabled, 'inside toggle not synchronized');
        form.elements.enabled.click();
        form.elements.recentCount.value = saved.recentCount;
        form.elements.extractPattern.value = saved.extractPattern;
    });
    await check('关闭与 Escape 取消事件保留预设草稿和滚动位置，并恢复入口焦点', async () => {
        const panel = document.querySelector('#world-os');
        const scroll = panel.querySelector('.wo-window-body');
        const content = panel.querySelector('.fm-ai-prompt [data-field="content"]');
        const saved = content.value;
        content.value = '尚未保存的预设草稿';
        scroll.scrollTop = 150;
        const position = scroll.scrollTop;
        document.querySelector('#wo-window-close').click();
        await waitFor(() => document.querySelector('#wo-launcher').getAttribute('aria-expanded') === 'false', 'close cleanup');
        assert(document.activeElement === document.querySelector('#wo-launcher'), 'focus not restored');
        document.querySelector('#wo-launcher').click();
        assert(panel.dataset.page === 'home', 'reopen did not start on app home');
        enterMemory();
        assert(content.value === '尚未保存的预设草稿' && scroll.scrollTop === position, 'window reopen reset draft or scroll');
        const event = new Event('cancel', { cancelable:true });
        panel.dispatchEvent(event);
        assert(event.defaultPrevented && !panel.open, 'native cancel not handled');
        await delay(30);
        document.querySelector('#wo-launcher').click();
        enterMemory();
        content.value = saved;
        scroll.scrollTop = 0;
    });
    await check('只填未保存的 URL 和密钥即可自动拉取、下拉选择模型', async () => {
        const form = document.querySelector('#fm-form');
        form.elements.model.value = '';
        form.elements.endpoint.value = location.origin + '/mock/v1/embeddings';
        form.elements.apiKey.value = 'browser-test-only-key';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        form.elements.apiKey.dispatchEvent(new Event('input'));
        form.elements.apiKey.dispatchEvent(new Event('change'));
        document.querySelector('#fm-embedding-panel').open = true;
        const select = document.querySelector('#fm-model-select');
        await waitFor(() => select.options.length === 4 && !select.disabled, 'automatic model load');
        const { modelCalls } = await state();
        assert(modelCalls.at(-1).path === '/mock/v1/models', 'models URL derived incorrectly');
        assert(modelCalls.at(-1).method === 'GET', 'models request not GET');
        assert(modelCalls.at(-1).authorization === 'Bearer browser-test-only-key', 'unsaved API key not used');
        assert(form.elements.model.value === '', 'automatic listing overwrote model input');
        assert([...select.options].some(option => option.value === 'private-opaque-id'), 'unknown model id filtered out');
        select.value = 'test-embedding-v2';
        select.dispatchEvent(new Event('change'));
        assert(form.elements.model.value === 'test-embedding-v2', 'dropdown selection not applied');
        assert(ctx.extensionSettings[MODULE_KEY].model === 'test-embedding', 'model persisted before save');
    });
    await check('修改连接取消旧模型列表请求，迟到响应不能覆盖新列表', async () => {
        const form = document.querySelector('#fm-form');
        form.elements.endpoint.value = location.origin + '/slow-models/v1';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-load-models').click();
        await waitFor(async () => (await state()).modelCalls.some(call => call.path.startsWith('/slow-models/')), 'slow model load began');
        form.elements.endpoint.value = location.origin + '/mock/v1';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        form.elements.endpoint.dispatchEvent(new Event('change'));
        const select = document.querySelector('#fm-model-select');
        await waitFor(() => [...select.options].some(option => option.value === 'private-opaque-id'), 'new models loaded');
        await delay(1800);
        assert(![...select.options].some(option => option.value === 'stale-model'), 'stale models replaced new models');
        assert(form.elements.model.value === 'test-embedding-v2', 'manual model changed during connection update');
    });
    await check('模型列表失败或为空时提示原因并保留手动模型入口', async () => {
        const form = document.querySelector('#fm-form');
        form.elements.endpoint.value = location.origin + '/failing-models/v1';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-load-models').click();
        await waitFor(() => document.querySelector('#fm-model-status').textContent.includes('HTTP 401'), 'model auth error');
        assert(document.querySelector('#fm-model-select').disabled, 'stale options remained selectable');
        assert(form.elements.model.value === 'test-embedding-v2', 'failed fetch erased manual input');
        form.elements.endpoint.value = location.origin + '/empty-models/v1';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-load-models').click();
        await waitFor(() => document.querySelector('#fm-model-status').textContent.includes('列表为空'), 'empty model list');
        form.elements.model.value = 'test-embedding';
        form.elements.model.dispatchEvent(new Event('input'));
        form.elements.endpoint.value = location.origin + '/mock/v1';
        form.elements.endpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-load-models').click();
        await waitFor(() => document.querySelector('#fm-model-select').value === 'test-embedding', 'selected model restored');
    });
    await check('重排模型列表使用独立未保存连接，支持选择、取消旧请求和手动回退', async () => {
        const form = document.querySelector('#fm-form');
        const embeddingSelection = document.querySelector('#fm-model-select').value;
        form.elements.rerankEndpoint.value = location.origin + '/slow-models/v2/rerank';
        form.elements.rerankApiKey.value = 'unsaved-rerank-key';
        form.elements.rerankEndpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-rerank-load-models').click();
        await waitFor(async () => (await state()).modelCalls.some(call => call.path === '/slow-models/v2/models'), 'slow rerank model load');
        form.elements.rerankEndpoint.value = location.origin + '/rerank-models/v1/rerank';
        form.elements.rerankEndpoint.dispatchEvent(new Event('input'));
        form.elements.rerankEndpoint.dispatchEvent(new Event('change'));
        const select = document.querySelector('#fm-rerank-model-select');
        await waitFor(() => [...select.options].some(option => option.value === 'test-reranker'), 'rerank model list');
        select.value = 'test-reranker'; select.dispatchEvent(new Event('change'));
        const request = (await state()).modelCalls.at(-1);
        assert(request.path === '/rerank-models/v1/models' && request.authorization === 'Bearer unsaved-rerank-key', 'rerank connection was not independent');
        assert(form.elements.rerankModel.value === 'test-reranker', 'rerank model selection not applied');
        await delay(1400);
        assert(![...select.options].some(option => option.value === 'stale-model'), 'stale rerank list replaced new one');
        assert(document.querySelector('#fm-model-select').value === embeddingSelection, 'rerank picker changed embedding picker');
        form.elements.rerankEndpoint.value = location.origin + '/failing-models/v1/rerank';
        form.elements.rerankEndpoint.dispatchEvent(new Event('input'));
        document.querySelector('#fm-rerank-load-models').click();
        await waitFor(() => document.querySelector('#fm-rerank-model-status').textContent.includes('401'), 'rerank models failure');
        assert(form.elements.rerankModel.value === 'test-reranker', 'failed rerank listing erased manual model');
    });
    await check('设置面板加载；保存设置时密钥默认只进入 sessionStorage', async () => {
        const form = document.querySelector('#fm-form');
        form.elements.enabled.checked = true;
        form.elements.apiKey.value = 'browser-test-only-key';
        form.elements.rerankApiKey.value = 'browser-rerank-only-key';
        form.elements.rerankEndpoint.value = location.origin + '/mock/v1/rerank';
        form.elements.rerankModel.value = 'test-reranker';
        form.dispatchEvent(new Event('submit', { cancelable:true, bubbles:true }));
        await waitFor(() => ctx.chatMetadata[MODULE_KEY]?.records.length === 8, 'auto extraction');
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('已同步'), 'sync settled');
        assert(ctx.extensionSettings[MODULE_KEY].apiKey === '', 'API key persisted without permission');
        assert(sessionStorage.getItem(MODULE_KEY + '.sessionKey') === 'browser-test-only-key', 'session key missing');
        assert(saves > 0, 'metadata not saved');
        assert(ctx.extensionSettings[MODULE_KEY].rerankApiKey === '', 'rerank key persisted without permission');
        assert(sessionStorage.getItem(MODULE_KEY + '.rerankSessionKey') === 'browser-rerank-only-key', 'rerank session key missing');
    });
    await check('未设置关键词不会因总结命中或旧词表而进入关键词召回', async () => {
        assert(!document.querySelector('[name="keywordDictionary"]'), 'supplement dictionary still visible');
        assert(!('keywordDictionary' in ctx.extensionSettings[MODULE_KEY]), 'obsolete dictionary not migrated');
        ctx.extensionSettings[MODULE_KEY].vectorEnabled = false;
        const output = await generate();
        assert(!output.some(message => message.mes.startsWith('[历史召回')), 'empty keywords triggered summary text matching');
        assert((await state()).calls.length === 0, 'vector-disabled generation made embedding calls');
        ctx.extensionSettings[MODULE_KEY].vectorEnabled = true;
    });
    await check('楼号、总结、关键词搜索原样保留；搜索不自动生成触发词', async () => {
        const search = document.querySelector('#fm-record-search');
        const filter = value => { search.value = value; search.dispatchEvent(new Event('input')); };

        assert(document.querySelectorAll('.fm-record').length === 1, 'summary text search changed');

        assert(card.querySelector('strong').textContent.includes('第 2 楼'), 'summary search result wrong');
        assert(card.querySelector('[data-field="keywords"]').value === '', 'search created implicit keywords');
        assert(card.textContent.includes('留空不参与关键词匹配'), 'empty keyword label still ambiguous');
        card.querySelector('[data-field="keywords"]').value = '星钥,KeyAlias';
        card.querySelector('[data-field="keywords"]').dispatchEvent(new Event('input'));
        await waitFor(() => ctx.chatMetadata[MODULE_KEY].records[1].keywords?.includes('KeyAlias'), 'manual keywords saved');
        filter('keyalias');
        assert(document.querySelectorAll('.fm-record').length === 1, 'case-insensitive keyword search changed');
        filter('钟楼');
        assert(document.querySelector('.fm-record strong').textContent.includes('第 7 楼'), 'summary search without keywords broken');
        filter('3');
        assert(document.querySelector('.fm-record strong').textContent.includes('第 3 楼'), 'floor-number search broken');
        filter('');
        assert(document.querySelectorAll('.fm-record').length === 8, 'clearing search failed');
    });
    await check('关键词输入直接生效并保存原始逗号；输入期间保留焦点和总结草稿', async () => {
        document.querySelector('#fm-records-panel').open = true;
        const card = document.querySelectorAll('.fm-record')[5];
        const input = card.querySelector('[data-field="keywords"]');
        const summary = card.querySelector('[data-field="summary"]');
        summary.value = '尚未保存的总结草稿';
        const snapshots = [];
        const saveMetadata = ctx.saveMetadata;
        ctx.saveMetadata = async () => {
            snapshots.push(structuredClone(ctx.chatMetadata));
            await delay(120);
        };
        input.focus();
        for (const text of ['15', '15,', '15, 12', '15, 12，12,']) {
            input.value = text;

        assert(cfg.aiKeywordPrompts.map(message => message.role).join(',') === 'system,assistant,user', 'preset role/order not saved');
        assert(cfg.cleanupRules.length === 1 && cfg.cleanupRules[0].pattern.includes('thinking'), 'preset polluted regex rules');
        assert(cfg.aiKeywordCleanupRules.length === 2 && cfg.aiKeywordExcludeUser, 'keyword cleanup not saved independently');
    });
    await check('AI 接口测试发送已保存预设和参数，测试关键词不写入聊天', async () => {
        const before = JSON.stringify(ctx.chatMetadata);
        document.querySelector('#fm-ai-test').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('AI 关键词接口测试成功'), 'AI connection test');
        assert(JSON.stringify(ctx.chatMetadata) === before, 'connection test altered actual records');
        const call = (await state()).keywordCalls.at(-1);
        assert(call.authorization === 'Bearer keyword-test-only-key' && call.model === 'small-instruct', 'AI key/model not independent');
        assert(call.temperature === .4 && call.top_p === .8 && call.max_tokens === 1024, 'sampling settings ignored');
        assert(call.response_format.type === 'json_object' && call.enable_thinking === false && call.chat_template_kwargs === undefined, 'SiliconFlow thinking/JSON settings ignored');
        assert(call.messages.map(message => message.role).join(',') === 'system,assistant,user', 'preset roles not used');
        assert(!JSON.stringify(call).includes('browser-test-only-key'), 'embedding key leaked to AI request');
        assert(document.querySelector('#fm-status').textContent.includes('人物1,地点1,12，12'), 'AI keyword cleanup did not apply to connection test');
        const diagnostics = document.querySelector('#fm-ai-diagnostics').textContent;
        assert(diagnostics.includes('接口往返') && diagnostics.includes('本地解析清洗') && diagnostics.includes('思考 0'), 'timing/token statistics missing');
    });
    await check('AI 一键分批处理全聊天总结，保留手动关键词，结果可直接编辑和召回', async () => {
        document.querySelector('#fm-record-search').value = '';
        document.querySelector('#fm-record-search').dispatchEvent(new Event('input'));
        document.querySelector('#fm-records-panel').open = true;
        const manual = document.querySelector('.fm-record [data-field="keywords"]');
        manual.value = '手动保留';
        manual.dispatchEvent(new Event('input'));
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('自动保存第 1 楼'), 'manual keyword saved');
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('AI 关键词已保存：7 / 7'), 'all missing summaries processed');
        const calls = (await state()).keywordCalls.slice(before);
        assert(calls.length === 3, 'wrong number of AI batches');
        assert(ctx.chatMetadata[MODULE_KEY].records[0].keywordText === '手动保留', 'manual keyword overwritten');
        assert(ctx.chatMetadata[MODULE_KEY].records.slice(1).every(record => record.keywordSource === 'ai' && record.keywords.includes('12，12')), 'AI keywords not mapped to records');
        assert(ctx.chatMetadata[MODULE_KEY].records[7].keywordText.includes('地点8'), 'recent floors were omitted from batch operation');
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('没有需要 AI'), 'repeat batch skipped');
        assert((await state()).keywordCalls.length === before + 3, 'processed records requested again');
        const originalQuery = ctx.chat.at(-1).mes;
        ctx.chat.at(-1).mes = '地点2';
        const output = await generate();
        assert(output.some(message => message.mes.startsWith('[历史召回 · 第 2 楼]')), 'AI keyword not used by existing matcher');
        ctx.chat.at(-1).mes = originalQuery;
    });
    await check('前 3 楼旧词清空后一键补空必须重填，非空后续楼层保持原样', async () => {
        const old = structuredClone(ctx.chatMetadata[MODULE_KEY].records);
        const inputs = [...document.querySelectorAll('.fm-record [data-field="keywords"]')].slice(0, 3);
        for (const input of inputs) {
            input.value = '';
            input.dispatchEvent(new Event('input'));
        }
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('自动保存第 3 楼'), 'first three keywords cleared');
        assert(ctx.chatMetadata[MODULE_KEY].records.slice(0, 3).every(record => !record.keywords.length), 'clear was not persisted');
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('AI 关键词已保存：3 / 3'), 'first three refilled');
        const next = ctx.chatMetadata[MODULE_KEY].records;
        assert((await state()).keywordCalls.length === before + 1, 'empty floors were skipped or nonempty floors requested');
        assert(next.slice(0, 3).every(record => record.keywordText === '人物' + record.floor + ',地点' + record.floor + ',12，12'), 'empty records not populated/cleaned');
        assert(next.slice(3).every((record, i) => record.keywordText === old[i + 3].keywordText), 'nonempty records were changed');
    });
    await check('夹杂已有关键词时，首批 items 后续直接数组都按实际楼号写入', async () => {
        const cfg = ctx.extensionSettings[MODULE_KEY];
        const previousEndpoint = cfg.aiKeywordEndpoint;
        cfg.aiKeywordEndpoint = location.origin + '/mixed-keywords/v1';
        const beforeRecords = structuredClone(ctx.chatMetadata[MODULE_KEY].records);
        const emptyFloors = [1, 2, 3, 5, 7, 8];
        const inputs = [...document.querySelectorAll('.fm-record [data-field="keywords"]')];
        for (const floor of emptyFloors) {
            inputs[floor - 1].value = '';
            inputs[floor - 1].dispatchEvent(new Event('input'));
        }
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('自动保存第 8 楼'), 'mixed floors cleared');
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('AI 关键词已保存：6 / 6'), 'mixed response batches saved');
        const calls = (await state()).keywordCalls.slice(before);
        assert(calls.length === 2, 'unexpected retry or already-populated floor requested');
        const floors = calls.map(call => {
            const input = call.messages.findLast(message => message.content.includes('[{"floor":')).content;
            return JSON.parse(input.slice(input.indexOf('[{"floor":'), input.lastIndexOf(']') + 1)).map(item => item.floor);
        });
        assert(JSON.stringify(floors) === '[[1,2,3],[5,7,8]]', 'nonempty floors entered batch');
        const next = ctx.chatMetadata[MODULE_KEY].records;
        assert(emptyFloors.every(floor => next[floor - 1].keywordText === '人物' + floor + ',地点' + floor + ',12，12'), 'direct array mapped by position or bypassed cleanup');
        assert([4, 6].every(floor => JSON.stringify(next[floor - 1]) === JSON.stringify(beforeRecords[floor - 1])), 'existing keywords were overwritten');
        cfg.aiKeywordEndpoint = previousEndpoint;
    });
    await check('JSON 本地修复后清洗并保存、显示处理说明；缺楼仍拒绝整批写入', async () => {
        const cfg = ctx.extensionSettings[MODULE_KEY];
        const previousEndpoint = cfg.aiKeywordEndpoint;
        cfg.aiKeywordEndpoint = location.origin + '/repair-keywords/v1';
        const inputs = [...document.querySelectorAll('.fm-record [data-field="keywords"]')];
        for (const floor of [2, 4, 6]) {
            inputs[floor - 1].value = '';
            inputs[floor - 1].dispatchEvent(new Event('input'));
        }
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('自动保存第 6 楼'), 'repair targets cleared');
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('AI 关键词已保存：3 / 3'), 'repaired batch saved');
        assert((await state()).keywordCalls.length === before + 1, 'repair requested AI again');
        const next = ctx.chatMetadata[MODULE_KEY].records;
        assert([2, 4, 6].every(floor => next[floor - 1].keywordText === '人物' + floor + ',地点' + floor + ',12，12'), 'repair skipped cleaning or altered punctuation');
        const diagnostics = document.querySelector('#fm-ai-diagnostics').textContent;
        assert(diagnostics.includes('JSON 兼容处理') && diagnostics.includes('多余括号') && diagnostics.includes('字符串楼号'), 'repair summary missing');
        const saved = JSON.stringify(ctx.chatMetadata);
        cfg.aiKeywordEndpoint = location.origin + '/invalid-keyword-json/v1';
        document.querySelector('#fm-ai-write-mode').value = 'replace';
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('本批 3 楼（1、2、3），返回 1 项'), 'incomplete JSON result rejected');
        assert(JSON.stringify(ctx.chatMetadata) === saved, 'incomplete result wrote partial keywords');
        assert((await state()).keywordCalls.length === before + 2, 'bad data triggered unbounded retry');
        document.querySelector('#fm-ai-write-mode').value = 'missing';
        cfg.aiKeywordEndpoint = previousEndpoint;
    });
    await check('全量重做逐批保存；后续批次失败时保留已完成结果', async () => {
        const cfg = ctx.extensionSettings[MODULE_KEY];
        cfg.aiKeywordEndpoint = location.origin + '/partial-keywords/v1';
        const old = structuredClone(ctx.chatMetadata[MODULE_KEY].records);
        document.querySelector('#fm-ai-write-mode').value = 'replace';
        document.querySelector('#fm-ai-generate').click();
        await waitFor(() => document.querySelector('#fm-status').textContent.includes('已完成 3 / 8 楼'), 'partial batch failure');
        const next = ctx.chatMetadata[MODULE_KEY].records;
        assert(next.slice(0,3).every(record => record.keywordText === '新人物' + record.floor), 'successful first batch not saved');
        assert(next.slice(3).every((record, i) => record.keywordText === old[i + 3].keywordText), 'failed/later batch corrupted');
        cfg.aiKeywordEndpoint = location.origin + '/keyword/v1';
    });
    await check('回复完成后只自动提取新楼，流式输出时等待，同一楼不重复请求', async () => {
        const cfg = ctx.extensionSettings[MODULE_KEY];
        cfg.aiKeywordAuto = true;
        const before = (await state()).keywordCalls.length;
        emit('GENERATION_STARTED');
        ctx.streamingProcessor = { isFinished:false };
        ctx.chat.push({ name:'向导', is_user:false, mes:'<summary>人物9在地点9得到线索。</summary>', send_date:301 });
        emit('MESSAGE_RECEIVED', ctx.chat.length - 1);
        await delay(500);
        assert((await state()).keywordCalls.length === before, 'automatic extraction ran during streaming');
        ctx.streamingProcessor.isFinished = true;
        emit('GENERATION_ENDED');
        await waitFor(() => ctx.chatMetadata[MODULE_KEY].records[8]?.keywordSource === 'ai', 'automatic keywords');
        assert((await state()).keywordCalls.length === before + 1, 'auto extraction scanned whole history');
        assert(ctx.chatMetadata[MODULE_KEY].records[8].keywords.includes('人物9'), 'new reply keywords missing');
        emit('MESSAGE_RECEIVED', ctx.chat.length - 1);
        emit('CHARACTER_MESSAGE_RENDERED', ctx.chat.length - 1);
        emit('GENERATION_ENDED');
        await delay(650);
        assert((await state()).keywordCalls.length === before + 1, 'duplicate reply event requested AI again');
        ctx.chat.push({ name:'旅行者', is_user:true, mes:'问题10' }, { name:'向导', mes:'没有总结的回复' });
        emit('MESSAGE_RECEIVED', ctx.chat.length - 1);
        await delay(650);
        assert((await state()).keywordCalls.length === before + 1, 'missing summary requested keyword extraction');
        cfg.aiKeywordAuto = false;
    });
    await check('AI 请求期间清空会取消迟到结果，之后新触发可以重新填写空关键词', async () => {
        const cfg = ctx.extensionSettings[MODULE_KEY];
        cfg.aiKeywordEndpoint = location.origin + '/slow-keywords/v1';
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(async () => (await state()).keywordCalls.length > before, 'slow keyword request');
        const input = document.querySelector('.fm-record [data-field="keywords"]');
        input.value = '';
        input.dispatchEvent(new Event('input'));
        await delay(2000);
        assert(ctx.chatMetadata[MODULE_KEY].records[0].keywordText === '' && ctx.chatMetadata[MODULE_KEY].records[0].keywordSource === 'manual', 'late AI result overwrote manual clear');
        cfg.aiKeywordAuto = true;
        cfg.aiKeywordEndpoint = location.origin + '/keyword/v1';
        const count = (await state()).keywordCalls.length;
        emit('MESSAGE_RECEIVED', 1);
        await waitFor(() => ctx.chatMetadata[MODULE_KEY].records[0].keywordSource === 'ai', 'fresh event refills empty keywords');
        assert((await state()).keywordCalls.length === count + 1, 'new trigger skipped manually cleared keywords');
        cfg.aiKeywordAuto = false;
        cfg.aiKeywordEndpoint = location.origin + '/slow-keywords/v1';
    });
    await check('AI 提取途中切换聊天不会把旧楼关键词写入新聊天', async () => {
        const before = (await state()).keywordCalls.length;
        document.querySelector('#fm-ai-generate').click();
        await waitFor(async () => (await state()).keywordCalls.length > before, 'AI request before chat switch');
        ctx = { ...ctx, chatId:'ai-next-chat', chatMetadata:{}, chat:[{ name:'向导', mes:'<summary>新聊天自己的总结</summary>' }] };
        emit('CHAT_CHANGED');
        await delay(2000);
        const records = ctx.chatMetadata[MODULE_KEY]?.records;
        assert(records?.length === 1 && records[0].extracted === '新聊天自己的总结' && !records[0].keywords, 'old AI result contaminated new chat');
    });
    ctx.chat = makeChat(); ctx.chatId = 'browser-chat'; ctx.chatMetadata = {};
    ctx.extensionSettings[MODULE_KEY].endpoint = location.origin + '/mock/v1';
    document.querySelector('#fm-rescan').click();
    await waitFor(() => ctx.chatMetadata[MODULE_KEY]?.records.length === 8, 'final display');
    document.querySelector('#fm-records-panel').open = false;
    document.querySelector('#browser-test-result').textContent = checks.length + ' browser checks passed';
    if (tauri) {
        await check('Android 窄屏设置不溢出，正则仅使用可终止的 classic Blob worker', async () => {
            assert(document.querySelector('#fm-runtime').textContent.includes('Android'), 'runtime not detected');
            assert(workerUrls.length > 0 && workerUrls.every(url => url.startsWith('blob:')), 'unexpected worker transport');
            const panel = document.querySelector('#world-os');
            for (const details of panel.querySelectorAll('details')) details.open = true;
            const scroll = panel.querySelector('.wo-window-body');
            assert(panel.open && document.documentElement.scrollWidth <= innerWidth + 1, 'mobile settings overflow');
            assert(scroll.scrollWidth <= scroll.clientWidth + 1, 'window content overflows horizontally');
        });
        await check('Tauri 安全边距和局部键盘高度生效，关闭按钮与底部表单均可达', async () => {
            const panel = document.querySelector('#world-os');
            assert(panel.dataset.ttMobileSurface === 'fullscreen-window', 'dialog not opted into mobile layout');
            assert(document.querySelector('#wo-launcher').dataset.ttMobileSurface === 'free-window', 'launcher surface not opted in');
            assert(layoutListeners.size === 1, 'host layout not subscribed exactly once');
            const root = document.documentElement;
            const insets = { top:32, right:12, bottom:24, left:6 };
            for (const [edge, value] of Object.entries(insets)) root.style.setProperty('--tt-inset-' + edge, value + 'px');
            root.style.setProperty('--tt-base-viewport-height', innerHeight + 'px');
            panel.style.setProperty('--tt-ime-bottom', '320px');
            for (const callback of layoutListeners) callback(testLayout(insets, 320 - insets.bottom));
            await delay(50);
            const rect = panel.getBoundingClientRect();
            assert(rect.top >= insets.top && rect.left >= insets.left && rect.right <= innerWidth - insets.right, 'dialog outside safe area');
            assert(rect.bottom <= innerHeight - 320 + 1, 'dialog hidden behind keyboard');
            const scroll = panel.querySelector('.wo-window-body');
            scroll.scrollTop = scroll.scrollHeight;
            const close = panel.querySelector('#wo-window-close').getBoundingClientRect();
            const last = panel.querySelector('#fm-next-page').getBoundingClientRect();
            assert(close.top >= rect.top && close.bottom < rect.bottom, 'close button scrolled out');
            assert(last.bottom <= rect.bottom && last.top >= close.bottom, 'bottom controls unreachable');
            const draft = panel.querySelector('[name="model"]').value;
            // Android host closes the topmost native dialog through close().
            const closeTrace = [];
            panel.addEventListener('close', () => closeTrace.push({ event:'close', open:panel.open, aria:document.querySelector('#wo-launcher').getAttribute('aria-expanded') }), { once:true });
            panel.addEventListener('beforetoggle', event => closeTrace.push({ event:'beforetoggle', newState:event.newState, open:panel.open }), { once:true });
            const nativeTarget = [...document.querySelectorAll('dialog[open]')].at(-1);
            nativeTarget.close();
            try {
                await waitFor(() => !panel.open && document.querySelector('#wo-launcher').getAttribute('aria-expanded') === 'false', 'native back close cleanup');
            } catch (error) {
                throw new Error(error.message + ' ' + JSON.stringify({ target:nativeTarget.id, panel:panel.id, open:panel.open, aria:document.querySelector('#wo-launcher').getAttribute('aria-expanded'), closeTrace }));
            }
            document.querySelector('#wo-launcher').click();
            enterMemory();
            assert(panel.querySelector('[name="model"]').value === draft, 'native back discarded draft');
            for (const edge of Object.keys(insets)) root.style.removeProperty('--tt-inset-' + edge);
            root.style.removeProperty('--tt-base-viewport-height');
            panel.style.removeProperty('--tt-ime-bottom');
            for (const callback of layoutListeners) callback(testLayout());
            scroll.scrollTop = 0;
        });
        await check('导出等待 Android 原生保存，并报告真实保存位置及失败', async () => {
            const prior = globalThis.__nativeExports?.length ?? 0;
            document.querySelector('#fm-export').click();
            await waitFor(() => (globalThis.__nativeExports?.length ?? 0) > prior, 'native download');
            await waitFor(() => document.querySelector('#fm-status').textContent.includes('Download/'), 'native saved path');
            const exported = globalThis.__nativeExports.at(-1);
            assert(exported.fileName.endsWith('.json'), 'wrong filename');
            assert(exported.data.records.length > 0, 'empty export');
            assert(!JSON.stringify(exported.data).includes('browser-test-only-key'), 'export leaked key');
            globalThis.__nativeExportFailure = true;
            document.querySelector('#fm-export').click();
            await waitFor(() => document.querySelector('#fm-status').textContent.includes('模拟原生写入失败'), 'native error');
            globalThis.__nativeExportFailure = false;
        });
        await check('Tauri MCP 工具轮与宿主剥离旧工具设置均保持 N/M 楼层和用户消息', async () => {
            ctx = { ...ctx, chatId:'tauri-tools', chatMetadata:{}, chat:[
                { name:'旅行者', is_user:true, mes:'搜索青石镇', send_date:1 },
                { name:'向导', is_user:false, mes:'', tool_calls:[{ id:'call-1' }], send_date:2 },
                { name:'search', is_system:true, is_user:false, role:'tool', tool_call_id:'call-1', mes:'青石镇资料', send_date:3 },
                { name:'向导', is_user:false, mes:'<summary>青石镇北门会合</summary>', send_date:4 },
                { name:'旅行者', is_user:true, mes:'然后呢', send_date:5 },
                { name:'向导', is_user:false, mes:'<summary>苏岚来到城门</summary>', send_date:6 },
                { name:'旅行者', is_user:true, mes:'继续', send_date:7 },
            ], extensionSettings:{ [MODULE_KEY]:{ ...ctx.extensionSettings[MODULE_KEY],
                enabled:true, aiKeywordAuto:false, recentCount:1, middleCount:1, recallCount:0 } },
                chatCompletionSettings:{ function_calling:true, strip_old_tool_calls:false } };
            emit('CHAT_CHANGED');
            let output = await generate();
            assert(ctx.chatMetadata[MODULE_KEY].records.length === 2, 'tool call consumed a floor');
            assert(output[0].mes === '搜索青石镇' && output[1].mes.includes('[近期召回 · 第 1 楼]'), 'middle user/summary missing');
            assert(!output.some(message => message.role === 'tool' || message.tool_calls), 'compressed tool half retained');
            ctx.chatCompletionSettings.strip_old_tool_calls = true;
            const prompt = ctx.chat.filter(message => !message.tool_calls && message.role !== 'tool')
                .map((message,index) => ({ ...structuredClone(message), index }));
            output = await generate('normal', prompt);
            assert(output[1].mes.includes('[近期召回 · 第 1 楼]'), 'stripped source floor mapping changed');
            document.querySelector('#fm-preview').click();
            await waitFor(() => document.querySelector('#fm-preview-output').textContent.includes('中间总结 M：第 1 楼'), 'tauri preview');
        });
    }
    const { runCharacterChecks } = await import('/tests/characters-browser.js');
    await runCharacterChecks({ check, assert, waitFor, delay, emit, getContext:()=>ctx, setContext:value=>{ctx=value;}, tauri, macros:registeredMacros });
    const { runCalendarChecks } = await import('/tests/calendar-browser.js');
    await runCalendarChecks({ check, assert, waitFor, delay, emit, getContext:()=>ctx, setContext:value=>{ctx=value;}, tauri, testLayout, layoutListeners });
    const { runLaboratoryChecks } = await import('/tests/laboratory-browser.js');
    await runLaboratoryChecks({ check, assert, waitFor, delay, emit, getContext:()=>ctx, setContext:value=>{ctx=value;}, tauri });
    globalThis.__testResult = { passed:checks, failures };
} catch (error) {
    document.querySelector('#browser-test-result').textContent = error.stack;
    globalThis.__testResult = { passed:checks, failures: failures.length ? failures : [error.stack] };
}
</script></body></html>
